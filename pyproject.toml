[project]
name = "wsnova"
version = "0.1.0"
description = "WSNova environmental monitoring and fuzzy fan control system"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "pydantic==2.14.1",
    "sqlalchemy==2.1.6",
    "psycopg[binary]==3.3.6",
    "numpy==2.5.4",
    "pytest==9.2.0",
]

[tool.vercel]
entrypoint = "backend.app.main:app"
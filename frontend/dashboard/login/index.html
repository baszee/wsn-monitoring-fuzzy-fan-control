<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Masuk admin — WSNova</title>
  <link rel="icon" type="image/svg+xml" href="/src/brand/wsnova-favicon.svg" />
    <link rel="apple-touch-icon" href="/src/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/tokens.css?v=20261111-2" />
  <link rel="stylesheet" href="/src/site.css?v=20261111-2" />
  <link rel="stylesheet" href="/src/ui.css?v=20261111-2" />
</head>
<body class="dashboard-body">
  <main class="login-wrap">
    <form class="panel login-card" id="login-form">
      <a class="brand" href="/dashboard/">
        <img class="brand-logo" data-brand-logo="full" src="/src/brand/wsnova-full-on-light.svg" alt="WSNova" />
      </a>
      <h1>Masuk admin</h1>
      <label>Nama pengguna<input id="username" name="username" autocomplete="username" required autofocus /></label>
      <label>Kata sandi<input id="password" name="password" type="password" autocomplete="current-password" required /></label>
      <p class="login-error" id="login-error" role="alert"></p>
      <button class="button button-primary" type="submit" id="login-btn">Masuk</button>
      <a class="login-back" href="/dashboard/">Kembali ke dashboard</a>
    </form>
  </main>
  <script type="module" src="/src/login.js?v=20261111-2"></script>
  <script type="module">import { applyBrand } from "/src/brand.js?v=1"; applyBrand();</script>
</body>
</html>

<!doctype html>
<html lang="id">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Riwayat — WSNova</title>
  <link rel="icon" type="image/svg+xml" href="/src/brand/favicon.svg" />
    <link rel="apple-touch-icon" href="/src/brand/apple-touch-icon.png" />
    <link rel="stylesheet" href="/src/site.css?v=20261101-5"/>
  <link rel="stylesheet" href="/src/pages.css?v=20261029-3"/>
    <link rel="stylesheet" href="/src/ui.css?v=5" />
  </head>
<body class="dashboard-body">
<div class="p2-shell">
  <aside class="sidebar" id="sidebar-root"></aside>
  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <div class="p2-main">
    <header class="p2-topbar">
      <div class="p2-topbar-title">
        <button class="menu-button" id="menu-button" aria-label="Buka navigasi"><i data-icon="menu"></i></button>
        <div>
          <h1>Riwayat Data</h1>
          <p>Tren pengukuran sensor &amp; kendali zona</p>
        </div>
      </div>
      <div class="p2-topbar-right">
        <div class="data-badge" id="connection-badge"><i></i><span>Memeriksa</span></div>
        <span class="updated-at" id="updated-at">—</span>
        <button class="icon-button" id="refresh-btn" title="Muat ulang">
          <svg viewBox="0 0 24 24"><path d="M20 6v5h-5M4 18v-5h5M6.1 9a7 7 0 0 1 11.7-2.6L20 11M4 13l2.2 4.6A7 7 0 0 0 18 15"/></svg>
        </button>
      </div>
    </header>

    <div class="page-body">
      <!-- Controls -->
      <div class="history-controls">
        <label>
          Node:
          <select id="node-select">
            <option value="">Memuat...</option>
          </select>
        </label>
        <label>
          Parameter:
          <select id="metric-select">
            <option value="temperature">Suhu (°C)</option>
            <option value="humidity">Kelembapan (% RH)</option>
            <option value="dust_index">Indeks Debu</option>
          </select>
        </label>
        <label>
          Rentang:
          <select id="range-select">
            <option value="1h">1 Jam</option>
            <option value="6h">6 Jam</option>
            <option value="24h" selected>24 Jam</option>
          </select>
        </label>
        <button class="sim-btn" id="load-btn">Muat Data</button>
      </div>

      <!-- Main Chart -->
      <div class="history-chart-wrap">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;">
          <h3 id="chart-title">Riwayat Suhu</h3>
          <span id="chart-stats" style="font-size:.78rem;color:var(--text-soft);"></span>
        </div>
        <div id="main-chart-wrap" class="history-svg-wrap">
          <div class="chart-loading">Pilih node dan parameter lalu klik Muat Data.</div>
        </div>
        <div id="chart-legend" style="display:flex;gap:1rem;margin-top:.5rem;font-size:.75rem;color:var(--text-soft);"></div>
      </div>

      <!-- Multi-node comparison -->
      <div class="panel-full">
        <h3>Perbandingan Semua Node — Nilai Terkini</h3>
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Node</th>
                <th>Suhu (°C)</th>
                <th>RH (%)</th>
                <th>Indeks Debu</th>
                <th>Skor Kondisi</th>
                <th>Tingkat Kendali</th>
                <th>Kelas</th>
                <th>Terakhir Update</th>
              </tr>
            </thead>
            <tbody id="comparison-table">
              <tr><td colspan="8" class="table-loading">Memuat data...</td></tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite">
  <span></span>
  <div><strong id="toast-title">Info</strong><p id="toast-message"></p></div>
</div>

<script type="module" src="/src/history.js?v=20261029-3"></script>
  <script type="module">import { applyBrand } from "/src/brand.js?v=1"; applyBrand();</script>
</body>
</html>
